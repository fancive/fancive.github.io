baseURL = 'https://fancive.github.io/'
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = 'fancive 的技术博客'
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = true
googleAnalytics = "G-7N49ZFJ61J"

[pagination]
pagerSize = 10

[taxonomies]
category = "categories"
tag = "tags"

[menu]
[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 5
[[menu.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 10
[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 15
[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 18
[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 20
[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 25

[params]
author = "fancive"
description = "专注 Go 语言、AI Agent 工程与系统可观测性（AIOps），记录真实的工程决策与踩坑过程。"
env = "production"
defaultTheme = "auto"
ShowReadingTime = true
ShowWordCount = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
ShowRssButtonInSectionTermList = true
# 首页社交分享卡的兜底图（文章会优先用自己的 cover）。
images = ["/images/og-default.jpg"]

  [params.homeInfoParams]
  Title = "Hi there 👋"
  Content = "工程师，写 Go、AI Agent 工具链和 AIOps。这里是思考的副产品。"

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/fancive"

  [[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

  [params.editPost]
  URL = "https://github.com/fancive/fancive.github.io/blob/main/content"
  Text = "在 GitHub 上查看/修改本文"
  appendFilePath = true

  [params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 1
  limit = 10
  keys = ["title", "permalink", "summary", "content"]

  [params.cover]
  linkFullImages = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
