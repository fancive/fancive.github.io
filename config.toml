baseURL = 'https://fancive.github.io/'
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = 'fancive 的技术博客'
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = true
googleAnalytics = "G-7N49ZFJ61J"

[pagination]
pagerSize = 10

[taxonomies]
category = "categories"
tag = "tags"

[menu]
[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 5
[[menu.main]]
identifier = "categories"
name = "主题"
url = "/categories/"
weight = 10
[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 15
[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 18
[[menu.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 20
[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 25

[params]
author = "fancive"
description = "专注 Go 语言、AI Agent 工程与系统可观测性（AIOps），记录真实的工程决策与踩坑过程。"
env = "production"
defaultTheme = "auto"
DateFormat = "2006年1月2日"
ShowReadingTime = true
ShowWordCount = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
ShowRssButtonInSectionTermList = true
mainSections = ["posts"]
featuredPost = "/posts/rewrite-cli-for-ai-agents"
# 首页社交分享卡的兜底图（文章会优先用自己的 cover）。
images = ["/images/og-default.jpg"]

  [params.homeInfoParams]
  Title = "工程实践，持续探索。"
  Content = "我是 fancive，写 Go、AI Agent 与 AIOps。记录真实问题、工程决策和一路踩过的坑。"

  [params.label]
  text = "fancive / 工程笔记"

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/fancive"

  [[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

  [params.editPost]
  URL = "https://github.com/fancive/fancive.github.io/blob/main/content"
  Text = "在 GitHub 上编辑"
  appendFilePath = true

  [params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 1
  limit = 10
  keys = ["title", "permalink", "summary", "content"]

  [params.cover]
  linkFullImages = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

# 图片同时挂到 assets，Hugo 才能给封面生成缩略图和 srcset，原图 URL 不变。
# 声明任一挂载会替换该目标的默认挂载，所以 assets/static 要显式保留。
[module]
  [[module.mounts]]
  source = "assets"
  target = "assets"
  [[module.mounts]]
  source = "static"
  target = "static"
  [[module.mounts]]
  source = "static/images"
  target = "assets/images"
